# The pull-request lane and the scheduled advisory check, copied from
# crumbkit/typescript-standards' templates/ci.yml. The lane keeps the steps
# whose "Runs when" condition this package meets, as typescript-standards.toml's
# `lanes` decision records (BASE-16).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

# A new push cancels the run for the previous push, because the newer run
# checks the same changes and more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # The pull-request lane's time budget (BASE-16).
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm/action-setup installs the pnpm that `packageManager` names, and
      # setup-node the Node that .node-version names (BASE-13). setup-node
      # caches pnpm's store, keyed by the lockfile.
      # The pin is the commit v6.1.0 points to; the template's d9184bf is the annotated tag object.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The step that reads only the workflows runs before any install, so a
      # pull request that fails it fails in seconds.
      - name: workflows
        run: pipx run zizmor==1.31.1 .
      - name: install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm run lint
      - name: typecheck
        run: pnpm run typecheck
      - name: knip
        run: pnpm run knip
      - name: test
        run: pnpm run test
      - name: build
        run: pnpm run build
      # Consumers install a git tag with no build of their own, so the
      # committed dist/ must be what the source builds. The step fails when
      # git reports any changed, deleted, untracked or ignored file under
      # dist/ after the build.
      - name: bundle
        run: pnpm run bundle

  advisories:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # pnpm audit reads the lockfile and asks the npm registry for advisories
      # against every package in it (BASE-17).
      - name: advisories
        run: pnpm audit
